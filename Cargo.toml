[package]
name = "voxcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "VoxCraft, a procedural voxel sandbox built with Bevy"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["3d", "ui", "audio", "vorbis", "x11", "wayland"] }
futures-lite = "2.6"
noise = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
